name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners rather than cross builds: tests can't run when
        # cross-compiled, and the per-FS fast paths are platform-specific.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  e2e:
    name: gui e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DIRSTATS_E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      # The GUI is rendered offscreen with wgpu. Windows (WARP) and macOS
      # (Metal) have an adapter already; Linux needs a software Vulkan driver.
      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # Includes the ignored test that scans the runner's whole system disk.
      - run: cargo test -p dirstats-gui --features e2e,egui-fonts --locked -- --include-ignored --nocapture
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: e2e-out/*.png
          if-no-files-found: warn

  bench-ntfs:
    name: ntfs bench (windows, elevated)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      # Hosted Windows runners run as an administrator, which reading the
      # MFT needs; fail loudly if that ever changes.
      - name: Check elevation
        shell: pwsh
        run: |
          $principal = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw "not elevated" }
      # D:\ holds only the checkout and build output; C:\ takes about 12 minutes.
      - run: cargo bench -p dirstats-ntfs --bench mft --locked
        env:
          DIRSTATS_BENCH_ROOT: 'D:\'
      - name: Upload criterion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntfs-bench
          path: target/criterion
          if-no-files-found: warn
