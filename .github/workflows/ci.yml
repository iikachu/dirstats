name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners rather than cross builds: tests can't run when
        # cross-compiled, and the per-FS fast paths are platform-specific.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  # Each feature on its own, with defaults off, so a cfg gate that only
  # compiles with the defaults (or a warning it leaves) is caught.
  features:
    name: feature combinations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --workspace --each-feature --exclude-features e2e --all-targets --locked

  # No hosted Arch runner exists, so run in the official container. Catches
  # breakage from Arch's rolling toolchain/libc ahead of Ubuntu LTS.
  test-arch:
    name: build + test (archlinux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rustup
      - uses: actions/checkout@v4
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  e2e:
    name: gui e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DIRSTATS_E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      # The GUI is rendered offscreen with wgpu. Windows (WARP) and macOS
      # (Metal) have an adapter already; Linux needs a software Vulkan driver.
      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # Includes the ignored tests: the one that scans the runner's whole
      # system disk, and the one that moves a fixture file to its trash.
      - run: cargo test -p dirstats-gui --features e2e,egui-fonts,trash --locked -- --include-ignored --nocapture
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: e2e-out/*.png
          if-no-files-found: warn

  e2e-arch:
    name: gui e2e (archlinux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      # In containers ${{ github.workspace }} is the host path; use the env var.
      - run: echo "DIRSTATS_E2E_OUT=$GITHUB_WORKSPACE/e2e-out" >> "$GITHUB_ENV"
      # vulkan-swrast is Arch's lavapipe package. Rendering is offscreen, so
      # no compositor (Wayland/X11) is needed.
      - run: pacman -Syu --noconfirm --needed base-devel git rustup vulkan-icd-loader vulkan-swrast
      - uses: actions/checkout@v4
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - run: cargo test -p dirstats-gui --features e2e,egui-fonts,trash --locked -- --include-ignored --nocapture
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-archlinux
          path: e2e-out/*.png

  ntfs-elevated:
    name: ntfs tests (windows, elevated)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ntfs
      # Hosted Windows runners run as an administrator, which reading the
      # MFT needs; fail loudly if that ever changes.
      - name: Check elevation
        shell: pwsh
        run: |
          $principal = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw "not elevated" }
      # Elevated-only tests: the MFT reader agrees with the walker, warm and
      # cold. The bench runs nightly (nightly.yml).
      - run: cargo test -p dirstats-ntfs --test mft_vs_walk --locked -- --ignored --test-threads=1
        env:
          DIRSTATS_TEST_VOLUME: 'D:\'
