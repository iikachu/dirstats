name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners rather than cross builds: tests can't run when
        # cross-compiled, and the per-FS fast paths are platform-specific.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      # Over SSH to this runner, as from a text console: the binary must
      # pick the terminal interface by itself. Windows keeps its window.
      - name: text console over ssh
        if: runner.os != 'Windows'
        run: .github/scripts/ssh_tui.sh target/debug/dirstats

  # Each feature on its own, with defaults off, so a cfg gate that only
  # compiles with the defaults (or a warning it leaves) is caught.
  features:
    name: feature combinations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --workspace --each-feature --exclude-features e2e --all-targets --locked

  # No hosted Arch runner exists, so run in the official container. Catches
  # breakage from Arch's rolling toolchain/libc ahead of Ubuntu LTS.
  test-arch:
    name: build + test (archlinux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rustup
      - uses: actions/checkout@v4
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  e2e:
    name: gui e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DIRSTATS_E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      # The GUI is rendered offscreen with wgpu. Windows (WARP) and macOS
      # (Metal) have an adapter already; Linux needs a software Vulkan driver.
      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # Fixture tests only, including the ignored one that moves a fixture
      # file to the trash. The whole-disk scan has its own job, disk-scan.
      - run: cargo test -p dirstats-gui --features e2e,egui-fonts,trash,delete --locked -- --include-ignored --skip real_disk_scan --nocapture
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: e2e-out/*.png
          if-no-files-found: warn

  e2e-arch:
    name: gui e2e (archlinux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      # In containers ${{ github.workspace }} is the host path; use the env var.
      - run: echo "DIRSTATS_E2E_OUT=$GITHUB_WORKSPACE/e2e-out" >> "$GITHUB_ENV"
      # vulkan-swrast is Arch's lavapipe package. Rendering is offscreen, so
      # no compositor (Wayland/X11) is needed.
      - run: pacman -Syu --noconfirm --needed base-devel git rustup vulkan-icd-loader vulkan-swrast
      - uses: actions/checkout@v4
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      # A container's disk is only the image, so there is no disk scan here.
      - run: cargo test -p dirstats-gui --features e2e,egui-fonts,trash,delete --locked -- --include-ignored --skip real_disk_scan --nocapture
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-archlinux
          path: e2e-out/*.png

  # The GUI scanning each runner's whole system disk through the real entry
  # point: minutes, not seconds, so it runs beside the fixture tests rather
  # than holding them up. Its screenshots differ on every run, so they are
  # uploaded under a name the PR screenshots bot doesn't collect.
  disk-scan:
    name: disk scan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DIRSTATS_E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test -p dirstats-gui --features e2e,egui-fonts,trash,delete,ntfs-mft --locked -- --ignored --exact e2e::real_disk_scan --nocapture
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disk-scan-screenshots-${{ matrix.os }}
          path: e2e-out/*.png
          if-no-files-found: warn
