[package]
name = "dirstats-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
license = "GPL-3.0-or-later"
description = "Terminal front end of the dirstats app (ratatui); not meant to be used on its own"
keywords = ["disk-usage", "treemap", "ratatui", "tui"]
categories = ["command-line-interface"]

[features]
default = []
trash = ["dirstats-core/trash"]
open = ["dirstats-core/open"]
# Scan whole NTFS volumes from the master file table (Windows, as administrator).
ntfs-mft = ["dirstats-core/ntfs-mft"]

[dependencies]
dirstats-core.workspace = true
ratatui.workspace = true

[dev-dependencies]
tempfile.workspace = true
