[package]
name = "dirstats-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Terminal front end for dirstats"

[features]
default = []
trash = ["dirstats-core/trash"]
open = ["dirstats-core/open"]
# Scan whole NTFS volumes from the master file table (Windows, as administrator).
ntfs-mft = ["dirstats-core/ntfs-mft"]

[dependencies]
dirstats-core.workspace = true
ratatui.workspace = true

[dev-dependencies]
tempfile.workspace = true
