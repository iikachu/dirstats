[package]
name = "dirstats-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Graphical front end for dirstats (egui)"

[features]
default = []
trash = ["dirstats-core/trash"]
delete = ["dirstats-core/delete"]
icloud = ["dirstats-core/icloud"]
open = ["dirstats-core/open"]
# Scan whole NTFS volumes from the master file table (Windows, as administrator).
ntfs-mft = ["dirstats-core/ntfs-mft"]
# Keep egui's bundled fonts and text sizes instead of the platform's own.
egui-fonts = []
# End-to-end tests that drive the whole GUI headlessly (CI only; pulls in wgpu).
e2e = ["dep:egui_kittest", "dep:tempfile"]

[build-dependencies]
# Draws the window icon at build time; nothing from it is linked into the GUI.
dirstats-icon.workspace = true

[dependencies]
dirstats-core.workspace = true
eframe.workspace = true
rfd.workspace = true
chrono.workspace = true
egui_kittest = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
