[package]
name = "dirstats-treemap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Treemap layouts and cushion rendering for dirstats trees"
keywords = ["treemap", "disk-usage", "visualization"]
categories = ["visualization"]

[features]
default = ["parallel"]
# Rasterise treemap bands on all cores.
parallel = ["dep:rayon"]

[dependencies]
dirstats-scan.workspace = true
rayon = { workspace = true, optional = true }
foldhash.workspace = true


[dev-dependencies]
png.workspace = true
tempfile.workspace = true
