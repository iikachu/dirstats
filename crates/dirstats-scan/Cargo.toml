[package]
name = "dirstats-scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Parallel cross-platform disk usage scanning into a compact tree"
keywords = ["disk-usage", "filesystem", "du", "scan"]
categories = ["filesystem"]

# Hosted docs: one page per platform, since the fast paths differ by OS.
[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[dependencies]
# Parallel native directory traversal (MIT, by Sebastian Thiel).
dua-core.workspace = true
foldhash.workspace = true

[dev-dependencies]
tempfile.workspace = true
