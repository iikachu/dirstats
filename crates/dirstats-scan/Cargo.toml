[package]
name = "dirstats-scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Parallel cross-platform disk usage scanning into a compact tree"
keywords = ["disk-usage", "filesystem", "du", "scan"]
categories = ["filesystem"]

[dependencies]
# Parallel native directory traversal (MIT, by Sebastian Thiel).
dua-core.workspace = true
foldhash.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
rayon.workspace = true

[[bench]]
name = "bulk_listing"
harness = false
