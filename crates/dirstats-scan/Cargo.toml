[package]
name = "dirstats-scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Parallel cross-platform disk usage scanning into a compact tree"
keywords = ["disk-usage", "filesystem", "du", "scan"]
categories = ["filesystem"]

[features]
default = ["linux-fast"]
# Walk Linux with getdents64 and statx instead of std::fs; no effect elsewhere.
linux-fast = ["dep:libc"]

[dependencies]
# Parallel native directory traversal (MIT, by Sebastian Thiel).
dua-core.workspace = true
foldhash.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Benchmark harness (Apache-2.0 OR MIT, by Brook Heisler and Jorge Aparicio).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }

[[bench]]
name = "scan"
harness = false
