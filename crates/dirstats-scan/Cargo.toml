[package]
name = "dirstats-scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Parallel cross-platform disk usage scanning into a compact tree"
keywords = ["disk-usage", "filesystem", "du", "scan"]
categories = ["filesystem"]

[dependencies]
# Parallel native directory traversal (MIT, by Sebastian Thiel).
dua-core.workspace = true
foldhash.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Benchmark harness (Apache-2.0 OR MIT, by Brook Heisler and Jorge Aparicio).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Baseline walker in the listing bench.
rayon.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# Emptying the standby list for cold-cache benches, and the raw listing.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[[bench]]
name = "listing"
harness = false
