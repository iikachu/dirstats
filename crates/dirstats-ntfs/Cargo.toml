[package]
name = "dirstats-ntfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "NTFS fast path for dirstats: reads the master file table instead of walking directories"
keywords = ["ntfs", "mft", "disk-usage", "scan"]
categories = ["filesystem"]

# Hosted docs: the master file table reader only exists on Windows.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
dirstats-scan.workspace = true
foldhash.workspace = true

[dev-dependencies]
# Benchmark harness (Apache-2.0 OR MIT, by Brook Heisler and Jorge Aparicio).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "mft"
harness = false

[target.'cfg(windows)'.dependencies]
# Volume handles and the FSCTLs that locate the master file table.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[target.'cfg(windows)'.dev-dependencies]
# Emptying the standby list for cold-cache tests and benches.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
