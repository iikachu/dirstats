[package]
name = "dirstats-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Front-end-agnostic application state for dirstats"

[features]
default = []
# Move-to-trash action.
trash = ["dep:trash", "dep:objc2-foundation"]
# Open and reveal actions via the desktop.
open = ["dep:open"]

[dependencies]
dirstats-scan.workspace = true
foldhash.workspace = true
trash = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Direct NSFileManager access for trashing with a Put Back location.
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }
open = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
