[package]
name = "dirstats-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "The dirstats library: scan state, background work and file actions, with the scanner and treemap re-exported"

# Hosted docs: every action, one page per platform, since permanent
# delete, Put Back and iCloud differ by OS. Linux first: it has the most.
[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[features]
default = []
# Move-to-trash action. On macOS it also uses NSFileManager (objc2-foundation)
# to learn where an item went, for Put Back.
trash = ["dep:trash", "dep:objc2-foundation"]
# Permanent delete, bypassing the trash, behind a per-run gate (Windows,
# Linux and macOS; the GUI only offers it on Windows and Linux).
delete = []
# Scan whole NTFS volumes from the master file table (Windows, needs
# administrator rights; the directory walker is used otherwise). Does
# nothing on other platforms.
ntfs-mft = ["dep:dirstats-ntfs"]
# Open and reveal actions via the desktop.
open = ["dep:open"]
# iCloud Drive status and "Remove Download" (macOS; a no-op elsewhere).
icloud = ["dep:objc2-foundation", "dep:objc2"]

[dependencies]
# The layers below; re-exported as `scan` and `treemap`, so front ends
# and library users depend on this crate alone.
dirstats-scan.workspace = true
dirstats-treemap.workspace = true
foldhash.workspace = true
trash = { workspace = true, optional = true }
open = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# Mount tables and filesystem sizes for the location picker.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# Reads the master file table of NTFS volumes; only built on Windows, so
# ntfs-mft does nothing elsewhere.
dirstats-ntfs = { workspace = true, optional = true }
# Drive enumeration; attribute clearing and delete-on-close for permanent deletion.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Direct NSFileManager access for trashing with a Put Back location, and
# NSURL resource values for iCloud status.
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL", "NSValue", "NSObject"] }
objc2 = { version = "0.6", optional = true }

[[example]]
name = "largest"
required-features = ["trash"]

[dev-dependencies]
tempfile.workspace = true
