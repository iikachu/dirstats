[package]
name = "dirstats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Disk usage scanner with treemaps, in a window or the terminal"
default-run = "dirstats"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dirstats"
path = "src/main.rs"

[features]
default = ["gui", "tui", "open", "trash", "delete", "icloud"]
# Graphical front end (egui).
gui = ["dep:dirstats-gui"]
# Terminal front end (ratatui + crossterm). Chosen with --tui, or on its own
# when no graphical session is available (a Linux console, SSH).
tui = ["dep:dirstats-tui"]
# Use egui's bundled fonts in the GUI instead of the platform's own, for comparison.
egui-fonts = ["dirstats-gui?/egui-fonts"]
# Open the selected entry with the desktop.
open = ["dirstats-app/open", "dirstats-tui?/open", "dirstats-gui?/open"]
# Move-to-trash action.
trash = ["dirstats-app/trash", "dirstats-tui?/trash", "dirstats-gui?/trash"]
# Permanent delete in the GUI, independent of the trash (Windows and Linux).
delete = ["dirstats-app/delete", "dirstats-gui?/delete"]
# iCloud Drive "Remove Download" action (macOS; does nothing elsewhere).
icloud = ["dirstats-app/icloud", "dirstats-gui?/icloud"]
# Write a cushion treemap PNG with `--png`.
png = ["dep:png"]

[dependencies]
dirstats-app.workspace = true
dirstats-scan.workspace = true
dirstats-ntfs.workspace = true
dirstats-treemap.workspace = true
dirstats-tui = { workspace = true, optional = true }
dirstats-gui = { workspace = true, optional = true }
clap.workspace = true
png = { workspace = true, optional = true }
