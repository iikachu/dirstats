[package]
name = "dirstats-icon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "The dirstats app icon, drawn as a cushion treemap, and a generator for its PNG, ICO, ICNS and SVG files"
keywords = ["icon", "treemap"]
categories = ["visualization"]

[features]
default = []
# The `dirstats-icon` program that writes the icon files; only it needs PNG
# encoding, so the GUI's build script, which uses the library, skips it.
cli = ["dep:png"]

[[bin]]
name = "dirstats-icon"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
dirstats-scan.workspace = true
# Same features as the app's, so the GUI's build script reuses the build.
dirstats-treemap.workspace = true
png = { workspace = true, optional = true }
