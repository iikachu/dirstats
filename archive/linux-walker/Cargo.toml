[package]
name = "dirstats-archive-linux-walker"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Archived: the experimental getdents64 + statx Linux walker and its benchmark (dirstats #18)"

# Its own workspace, so the main workspace (and so CI) never builds it.
[workspace]

[dependencies]
dirstats-scan = { path = "../../crates/dirstats-scan" }
foldhash = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rayon = "1.10"
# io_uring bindings (MIT OR Apache-2.0, by quininer and contributors).
io-uring = "0.7"

[dev-dependencies]
tempfile = "3"
