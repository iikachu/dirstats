[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
dirstats-scan = { path = "crates/dirstats-scan", version = "0.1.0" }
dirstats-treemap = { path = "crates/dirstats-treemap", version = "0.1.0" }
dirstats-app = { path = "crates/dirstats-app", version = "0.1.0" }
dirstats-tui = { path = "crates/dirstats-tui", version = "0.1.0" }
dirstats-gui = { path = "crates/dirstats-gui", version = "0.1.0" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
clap = { version = "4.5", features = ["derive"] }
open = "5"
trash = { version = "5.2", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
dua-core = "4.1"
png = "0.17"
rayon = "1.10"
tempfile = "3"
# Fast non-cryptographic hasher (Zlib, by Orson Peters).
foldhash = "0.1"
