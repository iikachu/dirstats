[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
dirstats-scan = { path = "crates/dirstats-scan", version = "0.1.0" }
dirstats-ntfs = { path = "crates/dirstats-ntfs", version = "0.1.0" }
dirstats-treemap = { path = "crates/dirstats-treemap", version = "0.1.0" }
dirstats-app = { path = "crates/dirstats-app", version = "0.1.0" }
dirstats-tui = { path = "crates/dirstats-tui", version = "0.1.0" }
dirstats-gui = { path = "crates/dirstats-gui", version = "0.1.0" }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Headless GUI harness with an offscreen wgpu renderer; only the e2e tests use it.
egui_kittest = { version = "0.33", features = ["eframe", "wgpu"] }
clap = { version = "4.5", features = ["derive"] }
open = "5"
# Windows needs one COM init mode; apartment-threaded matches a GUI main thread.
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
dua-core = "4.1"
png = "0.17"
rayon = "1.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tempfile = "3"
# Fast non-cryptographic hasher (Zlib, by Orson Peters).
foldhash = "0.1"
libc = "0.2"
